<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>DOLPHin · mode direct</title>
  <style>body{margin:0;padding:24px;background:#eef2f0} main{max-width:1100px;margin:auto}</style>
</head>
<body>
<main id="studio"></main>
<!-- Mode direct : pour une page d'administration privée sans serveur.
     Les clés sont saisies dans le navigateur et chiffrées sur l'appareil (AES-GCM). -->
<script src="../../dist/dolphin.js"></script>
<script>
  fetch("../brand.example.json").then(r => r.json()).then(brand => {
    Dolphin.mount("#studio", { mode: "direct", brand, model: "claude-opus-5-5" });
  });
</script>
</body>
</html>
